<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> SALUD Y VIDA DISCOTEK - Inicio de Sesión</title>
</head>

<body style="background-color:rgb(2, 2, 2); color:rgb(255, 252, 252);">

<main style="text-align:center;">
    <br>
    <h2 style="color:#ff007f;"> Bienvenidos a Salud y Vida DiscoteK </h2>
    <h4 style="font-family: serif;"> Inicia sesión para ver y manejar tus reservas. </h4>

    <form action="1.index.html" method="get">
        <p>
            <label for="correo">Correo:</label><br>
            <input type="email" id="correo" name="correo" required
                   style="background-color:#212121; color:#fcfcfc; border:1px solid #ff007f; padding:6px;">
        </p>
        <p>
            <label for="clave">Contraseña:</label><br>
            <input type="password" id="clave" name="clave" minlength="6" required
                   style="background-color:#212121; color:#fcfcfc; border:1px solid #ff007f; padding:6px;">
        </p>
        <p>
            <input type="submit" value="Entrar"
                   style="background-color:#ff007f; color:#fcfcfc; border:none; padding:8px 24px;">
        </p>
    </form>
</main>

<br>
<footer style="text-align:center;">
    <p><small>Calle 10 # 36-24, El Poblado, Medellín, Colombia</small></p>
    
</footer>

</body>
</html>
